services:
  web:
    build: .
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=codejam_dev;Username=postgres;Password=codejam2026
      DataProtection__KeysPath: /keys
      EnableHttpsRedirection: "false"
      TZ: America/New_York

    ports:
      - "8080:80"
    volumes:
      - aspnet_keys:/keys
    restart: unless-stopped

  runner:
    build: ./runner
    command: python hello.py
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

    ports:
      - "5001:5001"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: codejam_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: codejam2026
      TZ: America/New_York
      PGTZ: America/New_York

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/codejam_dev.sql:/docker-entrypoint-initdb.d/codejam_dev.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codejam_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  aspnet_keys:
